name: Processor native credential stores
on:
  push:
    paths:
      - 'processor/src/Mpa.Processor.Credentials/**'
      - 'processor/tests/Mpa.Processor.Credentials.Tests/**'
      - 'processor/tests/linux_vault_session.py'
      - 'processor/Directory.Build.props'
      - 'processor/global.json'
      - '.github/workflows/processor-credentials.yml'
  pull_request:
    paths:
      - 'processor/src/Mpa.Processor.Credentials/**'
      - 'processor/tests/Mpa.Processor.Credentials.Tests/**'
      - 'processor/tests/linux_vault_session.py'
      - 'processor/Directory.Build.props'
      - 'processor/global.json'
      - '.github/workflows/processor-credentials.yml'
permissions:
  contents: read
concurrency:
  group: processor-credentials-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  native-vault:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: true
      matrix:
        runner: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.303'
      - name: Linux native test prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libsecret-1-0 gnome-keyring dbus libglib2.0-bin
      - name: Locked restore and actual OS credential tests
        working-directory: processor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force build/credential-tests | Out-Null
          dotnet restore tests/Mpa.Processor.Credentials.Tests/Mpa.Processor.Credentials.Tests.csproj --locked-mode *> build/credential-tests/restore.log
          if ($LASTEXITCODE -ne 0) { Get-Content build/credential-tests/restore.log; exit $LASTEXITCODE }
          if ($IsLinux) {
            dbus-run-session -- python3 tests/linux_vault_session.py *> build/credential-tests/test.log
          } else {
            dotnet test tests/Mpa.Processor.Credentials.Tests/Mpa.Processor.Credentials.Tests.csproj --no-restore -c Release --logger 'trx;LogFileName=credentials.trx' --results-directory build/credential-tests *> build/credential-tests/test.log
          }
          $mpaTestExit = $LASTEXITCODE
          Get-Content build/credential-tests/test.log
          if ($mpaTestExit -ne 0) { exit $mpaTestExit }
          $mpaDiagnostic = Get-ChildItem build/credential-tests/*.log | Select-String -Pattern '\bwarning\b|\berror\b|\bcritical\b'
          if ($mpaDiagnostic) { $mpaDiagnostic; throw 'Native credential diagnostics are blocking.' }
          @{ Source = '${{ github.sha }}'; Runner = '${{ matrix.runner }}'; Scope = 'synthetic secrets in actual OS store; no Google grant';
             AssemblySha256 = (Get-FileHash src/Mpa.Processor.Credentials/bin/Release/net10.0/Mpa.Processor.Credentials.dll -Algorithm SHA256).Hash.ToLowerInvariant() } |
            ConvertTo-Json | Set-Content build/credential-tests/report.json -Encoding utf8
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: processor-credentials-${{ matrix.runner }}
          path: processor/build/credential-tests/
          if-no-files-found: error
          retention-days: 14
