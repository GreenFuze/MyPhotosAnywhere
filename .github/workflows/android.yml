name: Android checks
on:
  push:
  pull_request:
permissions:
  contents: read
# Internal PRs are covered by their trusted push run; external PRs use isolated test signing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - run: |
          python3 scripts/fetch_face_model.py
          python3 -m pip install 'numpy==1.26.4' 'tflite-runtime==2.14.0'
          python3 scripts/verify_face_model.py
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare protected upgrade signer
        if: github.event_name == 'push'
        env:
          MPA_UPGRADE_KEYSTORE_B64: ${{ secrets.MPA_UPGRADE_KEYSTORE_B64 }}
        run: python3 scripts/ci_upgrade_signer.py
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Install pinned stable Android SDK
        run: python3 scripts/ci_android_sdk.py
      - name: Build, test and lint with complete diagnostics
        run: |
          set -euo pipefail
          mkdir -p build/diagnostics
          python3 scripts/test_gradle_checks.py
          python3 scripts/gradle_checks.py --log build/diagnostics/build.log -- testDebugUnitTest lintDebug assembleDebug
      - run: python3 scripts/gradle_checks.py --log app/build/reports/signing-report.txt -- signingReport
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: MPA-debug
          if-no-files-found: error
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: MPA-checks
          if-no-files-found: error
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
            app/build/reports/signing-report.txt
            app/build/reports/signing-report.gate.json
            app/schemas/
            build/diagnostics/
            build/reports/problems/
      - name: Remove temporary upgrade signer
        if: always()
        run: rm -f -- "$RUNNER_TEMP/mpa-upgrade.keystore"
