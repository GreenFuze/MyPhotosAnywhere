name: Android checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
      - run: ./gradlew signingReport --console=plain > app/build/reports/signing-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MPA-debug
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MPA-checks
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
            app/build/reports/signing-report.txt
            app/schemas/
