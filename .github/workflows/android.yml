name: Android checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - run: |
          python3 scripts/fetch_face_model.py
          python3 -m pip install 'numpy==1.26.4' 'tflite-runtime==2.14.0'
          python3 scripts/verify_face_model.py
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.config/.android/debug.keystore
            ~/.android/debug.keystore
          key: mpa-private-debug-signing-v1-${{ runner.os }}
      - uses: gradle/actions/setup-gradle@v6.4.0
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;30.0.16248370'
      - name: Build, test and lint with complete diagnostics
        run: |
          set -euo pipefail
          mkdir -p build/diagnostics
          python3 scripts/test_gradle_checks.py
          python3 scripts/gradle_checks.py --log build/diagnostics/build.log -- testDebugUnitTest lintDebug assembleDebug
      - run: python3 scripts/gradle_checks.py --log app/build/reports/signing-report.txt -- signingReport
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: MPA-debug
          if-no-files-found: error
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: MPA-checks
          if-no-files-found: error
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
            app/build/reports/signing-report.txt
            app/build/reports/signing-report.gate.json
            app/schemas/
            build/diagnostics/
            build/reports/problems/
