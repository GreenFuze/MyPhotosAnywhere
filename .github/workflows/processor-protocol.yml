name: Processor protocol contracts
on:
  push:
    paths:
      - 'processor/src/**'
      - 'processor/tests/**'
      - 'processor/Directory.Build.props'
      - 'processor/global.json'
      - 'protocol/**'
      - '.github/workflows/processor-protocol.yml'
  pull_request:
    paths:
      - 'processor/src/**'
      - 'processor/tests/**'
      - 'processor/Directory.Build.props'
      - 'processor/global.json'
      - 'protocol/**'
      - '.github/workflows/processor-protocol.yml'
permissions:
  contents: read
concurrency:
  group: processor-protocol-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  contracts:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: true
      matrix:
        runner: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    # Windows scale-fixture setup alone took 13m16s in run39568011044, with
    # all84 Core tests passing. Retain every test/diagnostic gate and allow the
    # remaining suites to finish; this is not a query-latency acceptance waiver.
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.303'
      - name: Locked restore and strict contract tests
        working-directory: processor
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/protocol-tests | Out-Null
          $mpaProjects = @(
            @{ Name = 'protocol'; Path = 'tests/Mpa.Processor.Protocol.Tests/Mpa.Processor.Protocol.Tests.csproj' },
            @{ Name = 'core'; Path = 'tests/Mpa.Processor.Core.Tests/Mpa.Processor.Core.Tests.csproj' },
            @{ Name = 'google'; Path = 'tests/Mpa.Processor.GoogleDrive.Tests/Mpa.Processor.GoogleDrive.Tests.csproj' },
            @{ Name = 'setup'; Path = 'tests/Mpa.Processor.AppServices.Tests/Mpa.Processor.AppServices.Tests.csproj' },
            @{ Name = 'lan'; Path = 'tests/Mpa.Processor.Lan.Tests/Mpa.Processor.Lan.Tests.csproj' },
            @{ Name = 'web'; Path = 'tests/Mpa.Processor.Web.Tests/Mpa.Processor.Web.Tests.csproj' }
          )
          foreach ($mpaProject in $mpaProjects) {
            $mpaName = $mpaProject.Name
            dotnet restore $mpaProject.Path --locked-mode *> "build/protocol-tests/$mpaName-restore.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $mpaArguments = @($mpaProject.Path, '--no-restore', '-c', 'Release', '--logger', "trx;LogFileName=$mpaName.trx", '--results-directory', 'build/protocol-tests')
            # Every existing assertion remains in this job. The new publication
            # measurements run in the mandatory scale matrix below on this same SHA.
            if ($mpaName -eq 'setup') { $mpaArguments += @('--filter', 'TestCategory!=LargeCatalogPublication') }
            dotnet test @mpaArguments *> "build/protocol-tests/$mpaName-test.log"
            $mpaContractExit = $LASTEXITCODE
            Get-Content "build/protocol-tests/$mpaName-test.log"
            if ($mpaContractExit -ne 0) { exit $mpaContractExit }
          }
          $mpaDiagnostic = Get-ChildItem build/protocol-tests/*.log | Select-String -Pattern '\bwarning\b|\berror\s+[A-Z]+\d+\s*:'
          if ($mpaDiagnostic) { $mpaDiagnostic; throw 'Protocol diagnostics are blocking.' }
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: processor-protocol-${{ matrix.runner }}
          path: processor/build/protocol-tests/
          if-no-files-found: error
          retention-days: 14
  scale:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: true
      matrix:
        runner: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    # New real 10k/100k publication fixtures took 43m52s locally before key reuse.
    # Keep each fixture's own cancellation and every preservation assertion; this
    # job budget separates measurements from the unchanged regression matrix.
    timeout-minutes: 70
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.303'
      - name: Locked large publication measurements and preservation assertions
        working-directory: processor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force build/catalog-scale | Out-Null
          $mpaProject = 'tests/Mpa.Processor.AppServices.Tests/Mpa.Processor.AppServices.Tests.csproj'
          dotnet restore $mpaProject --locked-mode *> build/catalog-scale/restore.log
          if ($LASTEXITCODE -ne 0) { Get-Content build/catalog-scale/restore.log; exit $LASTEXITCODE }
          dotnet test $mpaProject --no-restore -c Release --filter 'TestCategory=LargeCatalogPublication' --logger 'trx;LogFileName=scale.trx' --results-directory build/catalog-scale *> build/catalog-scale/test.log
          $mpaTestExit = $LASTEXITCODE
          Get-Content build/catalog-scale/test.log
          if ($mpaTestExit -ne 0) { exit $mpaTestExit }
          $mpaDiagnostic = Get-ChildItem build/catalog-scale/*.log | Select-String -Pattern '\bwarning\b|\berror\s+[A-Z]+\d+\s*:'
          if ($mpaDiagnostic) { $mpaDiagnostic; throw 'Scale diagnostics are blocking.' }
          [xml]$mpaTrx = Get-Content build/catalog-scale/scale.trx
          $mpaSummary = $mpaTrx.TestRun.ResultSummary
          if ($mpaSummary.outcome -ne 'Completed' -or $mpaSummary.Counters.total -ne '2' -or $mpaSummary.Counters.passed -ne '2') {
            throw 'Both large-fixture preservation cases must pass without skips.'
          }
          foreach ($mpaCounter in @('failed','error','warning','notExecuted','timeout','aborted','inconclusive')) {
            if ([int]$mpaSummary.Counters.GetAttribute($mpaCounter) -ne 0) { throw "Unresolved scale outcome: $mpaCounter" }
          }
          $mpaMetrics = @($mpaTrx.TestRun.Results.UnitTestResult | ForEach-Object {
            if ($_.outcome -ne 'Passed') { throw 'Unpassed scale fixture.' }
            $mpaLines = @(([string]$_.Output.StdOut) -split "`n" | Where-Object { $_.Trim().StartsWith('{"incrementalGenerationFixture"') })
            if ($mpaLines.Count -ne 1) { throw 'Each real fixture must retain its measured report.' }
            $mpaLines[0] | ConvertFrom-Json
          })
          if (@($mpaMetrics.incrementalGenerationFixture | Sort-Object -Unique) -join ',' -ne '10000,100000') { throw 'Scale fixture sizes changed.' }
          @{ Source = '${{ github.sha }}'; Runner = '${{ matrix.runner }}'; Measurements = $mpaMetrics;
             Scope = 'Actual native capture/current owner/full prepared graph with synthetic Drive; live network, UI and final signed completion remain separate.';
             TestAssemblySha256 = (Get-FileHash tests/Mpa.Processor.AppServices.Tests/bin/Release/net10.0/Mpa.Processor.AppServices.Tests.dll -Algorithm SHA256).Hash.ToLowerInvariant() } |
            ConvertTo-Json -Depth 12 | Set-Content build/catalog-scale/report.json -Encoding utf8
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: processor-catalog-scale-${{ matrix.runner }}
          path: processor/build/catalog-scale/
          if-no-files-found: error
          retention-days: 14
