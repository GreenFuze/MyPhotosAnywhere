name: Android device checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  device:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        api: [29, 35, "37.0"]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Install pinned stable Android SDK
        run: python3 scripts/ci_android_sdk.py ${{ matrix.api }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install emulator host libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libx11-xcb-dev
      - name: Native regression and scale tests
        run: bash scripts/ci_emulator.sh '${{ matrix.api }}'
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: MPA-device-checks-${{ matrix.api }}
          if-no-files-found: error
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            build/diagnostics/
            build/reports/problems/
  evidence:
    needs: device
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@v7.0.2
        with:
          name: MPA-device-checks
          pattern: MPA-device-checks-*
          separate-directories: true
