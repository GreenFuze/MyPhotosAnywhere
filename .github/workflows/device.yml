name: Android device checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  device:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        api: [29, 35, "37.0"]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6.4.0
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;30.0.16248370'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.api == '37.0' && 'google_apis' || 'default' }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run_device_checks.sh
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: MPA-device-checks-${{ matrix.api }}
          if-no-files-found: error
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            build/diagnostics/
            build/reports/problems/
  evidence:
    needs: device
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@v7.0.2
        with:
          name: MPA-device-checks
          pattern: MPA-device-checks-*
          separate-directories: true
