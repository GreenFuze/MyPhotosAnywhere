name: Android device checks
on:
  push:
  pull_request:
permissions:
  contents: read
# Internal PRs are covered by their trusted push run; external PRs use isolated test signing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  device:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        api: ["37.0"]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Reserve emulator disk space
        run: |
          # These unrelated preinstalled runtimes are unused by MPA's Java/Python checks.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h .
          python3 -c 'import shutil; assert shutil.disk_usage(".").free >= 14 * 1024**3, "Insufficient space for the API 37 image and userdata"'
      - name: Install pinned stable Android SDK
        run: python3 scripts/ci_android_sdk.py ${{ matrix.api }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install emulator host libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libx11-xcb-dev
      - name: Focused camera and video diagnostic
        run: bash scripts/ci_emulator.sh '${{ matrix.api }}'
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: MPA-device-checks-${{ matrix.api }}
          if-no-files-found: error
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            build/diagnostics/
            build/reports/problems/
