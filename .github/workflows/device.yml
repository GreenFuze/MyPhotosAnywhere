name: Android device checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  device:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        api: [29, 35]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            # Native fixtures use synthetic accounts and cached data, never live Google services.
            # Keep offline browsing checks independent of authentication/network error timing.
            adb shell svc wifi disable
            adb shell svc data disable
            ./gradlew connectedDebugAndroidTest --no-daemon
            mkdir -p app/build/reports/androidTests/screenshots
            adb pull /sdcard/Download/MPA/device-preview.png app/build/reports/androidTests/screenshots/mpa-edit.png
            adb pull /sdcard/Download/MPA/import-preview.png app/build/reports/androidTests/screenshots/mpa-import.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MPA-device-checks-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
  evidence:
    needs: device
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: MPA-device-checks
          pattern: MPA-device-checks-*
          separate-directories: true
